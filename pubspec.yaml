name: viralcut_mobile
description: Halchal creator app — campaigns, submissions, wallet (Flutter).
publish_to: "none"
version: 0.1.19+23

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  viralcut_ui_tokens:
    path: packages/ui-tokens
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  dio: ^5.8.0+1
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.5.3
  intl: ^0.20.2
  google_fonts: ^6.2.1
  url_launcher: ^6.3.1
  socket_io_client: ^3.1.2
  flutter_animate: ^4.5.2
  cached_network_image: ^3.4.1
  image_picker: ^1.1.2
  package_info_plus: ^8.1.2
  video_player: ^2.9.2
  flutter_svg: ^2.0.17
  firebase_core: ^4.13.0
  firebase_messaging: ^16.5.0
  app_links: ^7.2.1
  flutter_web_auth_2: ^4.1.0
  gal: ^2.3.3
  path_provider: ^2.1.6
  flutter_local_notifications: ^22.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/images/halchal_app_icon.png"
  remove_alpha_ios: true
  min_sdk_android: 21
  adaptive_icon_foreground: "assets/images/halchal_app_icon.png"
  adaptive_icon_background: "#FFFFFF"
  web:
    generate: false

flutter:
  uses-material-design: true
  assets:
    - assets/images/viralcut_app_icon.png
    - assets/images/halchal_logo.png
    - assets/images/onboarding_hero.svg
    - assets/images/onboarding_hero_marketplace.svg
    - assets/images/platform_instagram.svg
    - assets/images/platform_youtube.svg
    - assets/images/platform_x.svg
    - assets/images/campaigns_empty_caught_up.svg
    - assets/images/campaigns_empty_none.svg
    # Bundled Inter/Plus Jakarta Sans weights — google_fonts prefers a
    # matching local asset file over its own HTTP fetch (see its README),
    # so every existing GoogleFonts.inter()/.plusJakartaSans() call in the
    # app now resolves offline with no code changes needed. Without this,
    # any of those calls could render blank text if the device can't reach
    # fonts.gstatic.com at that exact moment — worst case, on the login/
    # signup screen a brand-new user sees first.
    - assets/google_fonts/
